name: Atualizar dados e publicar site

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 06:17 em Brasília
  workflow_dispatch:        # botão "Run workflow" para rodar na hora
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar dados do Senado
        if: github.event_name != 'push'
        run: python coletor/coletor.py

      - name: Preparar IA aberta (Ollama)
        if: github.event_name != 'push'
        id: ollama
        continue-on-error: true
        env:
          MODELO_IA: qwen3:4b
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          mkdir -p "$HOME/.ollama-models"
          OLLAMA_MODELS="$HOME/.ollama-models" nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -s http://127.0.0.1:11434/api/version && break; sleep 2; done
          OLLAMA_MODELS="$HOME/.ollama-models" ollama pull "$MODELO_IA"

      - name: Gerar explicações com IA
        if: github.event_name != 'push' && steps.ollama.outcome == 'success'
        continue-on-error: true
        env:
          PROVEDOR_IA: ollama
          MODELO_IA: qwen3:4b
          MAX_EXPLICACOES: "200"
          TEMPO_MAX_MIN: "70"
        run: python coletor/explicar.py

      - name: Guardar dados no repositório
        if: github.event_name != 'push'
        run: |
             git config user.name "potikia-bot"
             git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
             git add data/
             git diff --cached --quiet || git commit -m "Atualiza dados do Senado"
             git pull --rebase origin main
             git push
             
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
