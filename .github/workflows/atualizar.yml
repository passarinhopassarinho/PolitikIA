name: Atualizar dados e publicar site

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar dados do Senado
        if: github.event_name != 'push'
        run: python coletor/coletor.py
      - name: Guardar dados no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "potikia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/senado.json
          git diff --cached --quiet || git commit -m "Atualiza dados do Senado"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
